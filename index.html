<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QSHE" />
    <meta name="theme-color" content="#388087" />
    <meta name="description" content="Quality, Safety, Health & Environment Management System" />
    <title>QSHE</title>
    <script>
      // FORCE remove dark mode
      (function() {
        // Clear localStorage
        localStorage.removeItem('darkMode');
        localStorage.removeItem('qshe-theme');
        localStorage.setItem('darkMode', 'false');
        
        // Force remove dark class
        document.documentElement.classList.remove('dark');
        
        console.log('Dark mode forced OFF');
        console.log('localStorage.darkMode:', localStorage.getItem('darkMode'));
        console.log('HTML classes:', document.documentElement.className);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
